<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}BEA Designs{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #1b1b1d;
    --charcoal-soft: #232326;
    --blueprint: #1b4f72;
    --blueprint-bright: #2e86c1;
    --brass: #c7a464;
    --paper: #f7f5f1;
    --ink: #2a2a2a;
    --off-white: #f1efea;
    --border: #e6e2da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.6;
  }
  h1, h2, h3, .brand, .eyebrow, .stat-label, .btn {
    font-family: 'Big Shoulders Display', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  a { color: inherit; }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 2rem; }

  /* Header / nav */
  header {
    background: var(--charcoal);
    color: var(--off-white);
    padding: 1.25rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand { font-size: 1.4rem; font-weight: 800; color: var(--off-white); text-decoration: none; }
  header .brand span { color: var(--brass); }
  nav a {
    color: var(--off-white);
    text-decoration: none;
    margin-left: 1.75rem;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: 'IBM Plex Sans', sans-serif;
    text-transform: none;
    letter-spacing: normal;
    border-bottom: 2px solid transparent;
    padding-bottom: 3px;
  }
  nav a.active, nav a:hover { border-bottom-color: var(--brass); }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 0.85rem 1.9rem;
    border-radius: 4px;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .btn-brass { background: var(--brass); color: var(--charcoal); }
  .btn-brass:hover { background: #d4b478; }
  .btn-outline { background: transparent; border-color: var(--off-white); color: var(--off-white); }
  .btn-outline:hover { border-color: var(--brass); color: var(--brass); }

  /* Section scaffolding */
  .section { padding: 4.5rem 0; }
  .section-alt { background: #fff; }
  .section-head { text-align: center; max-width: 640px; margin: 0 auto 3rem; }
  .section-head h2 { font-size: 2.2rem; margin: 0 0 0.6rem; color: var(--charcoal); }
  .section-sub { color: #666; font-size: 1.05rem; margin: 0; }
  .rule { width: 60px; height: 3px; background: var(--brass); margin: 0.75rem auto 0; }

  footer {
    background: var(--charcoal);
    color: var(--off-white);
    text-align: center;
    padding: 2.75rem 1rem;
  }
  footer .brand { display: block; font-size: 1.2rem; margin-bottom: 0.4rem; text-decoration: none; }
  footer p { margin: 0.2rem 0; opacity: 0.75; font-size: 0.9rem; }
  footer .badge {
    display: inline-block;
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--brass);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  {% block extra_style %}{% endblock %}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<header>
  <a class="brand" href="/">BEA<span>DESIGNS</span></a>
  <nav>
    <a href="/#about">About</a>
    <a href="/#services">Services</a>
    <a href="/#why-us">Why Us</a>
    <a href="/blog"{% if request.path.startswith('/blog') %} class="active"{% endif %}>Blog</a>
    <a href="/#contact">Get In Touch</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <a class="brand" href="/">BEADESIGNS</a>
  <p>Precision. Customization. Excellence.</p>
  <p>&copy; 2026 BEA Designs. All rights reserved.</p>
  <span class="badge">&#128274; Secured &amp; Protected</span>
</footer>

</body>
</html>
